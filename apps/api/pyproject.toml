[project]
name = "api"
version = "0.1.0"
description = "FastAPI service"
readme = "README.md"
authors = [
    { name = "Mikchail Aptraev", email = "aptraevmv@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pyjwt>=2.10.1",
    "bcrypt>=4.2.1",
    "pydantic-settings>=2.15.0",
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.2",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
